plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android { namespace 'com.julianb183.questterminal'; compileSdk 35
    defaultConfig {
        applicationId 'com.julianb183.questterminal'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
}

// Use the working Java 21 runtime bundled with Minecraft on this Mac.
kotlin { jvmToolchain(21) }

